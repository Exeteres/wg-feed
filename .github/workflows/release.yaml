name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/exeteres/wg-feed

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release version
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify GoReleaser binaries for image packaging
        run: |
          set -euo pipefail
          for name in server upload daemon apply; do
            for arch in amd64 arm64; do
              path="dist/wg-feed-${name}_linux_${arch}"
              test -f "$path" || { echo "missing expected binary: $path" >&2; exit 1; }
              test -f "${path}.sbom.json" || { echo "missing expected binary sbom: ${path}.sbom.json" >&2; exit 1; }
            done
          done

      - name: Attest Linux binaries provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/wg-feed-server_linux_amd64
            dist/wg-feed-server_linux_arm64
            dist/wg-feed-upload_linux_amd64
            dist/wg-feed-upload_linux_arm64
            dist/wg-feed-daemon_linux_amd64
            dist/wg-feed-daemon_linux_arm64
            dist/wg-feed-apply_linux_amd64
            dist/wg-feed-apply_linux_arm64

      - name: Attest wg-feed-server linux amd64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-server_linux_amd64
          sbom-path: dist/wg-feed-server_linux_amd64.sbom.json

      - name: Attest wg-feed-server linux arm64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-server_linux_arm64
          sbom-path: dist/wg-feed-server_linux_arm64.sbom.json

      - name: Attest wg-feed-upload linux amd64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-upload_linux_amd64
          sbom-path: dist/wg-feed-upload_linux_amd64.sbom.json

      - name: Attest wg-feed-upload linux arm64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-upload_linux_arm64
          sbom-path: dist/wg-feed-upload_linux_arm64.sbom.json

      - name: Attest wg-feed-daemon linux amd64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-daemon_linux_amd64
          sbom-path: dist/wg-feed-daemon_linux_amd64.sbom.json

      - name: Attest wg-feed-daemon linux arm64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-daemon_linux_arm64
          sbom-path: dist/wg-feed-daemon_linux_arm64.sbom.json

      - name: Attest wg-feed-apply linux amd64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-apply_linux_amd64
          sbom-path: dist/wg-feed-apply_linux_amd64.sbom.json

      - name: Attest wg-feed-apply linux arm64 binary SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/wg-feed-apply_linux_arm64
          sbom-path: dist/wg-feed-apply_linux_arm64.sbom.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push wg-feed-server
        id: build_server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/scratch.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/server:latest
            ${{ env.IMAGE_PREFIX }}/server:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY_PREFIX=dist/wg-feed-server_linux

      - name: Sign wg-feed-server image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/server@${{ steps.build_server.outputs.digest }}"

      - name: Attest wg-feed-server image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/server
          subject-digest: ${{ steps.build_server.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate wg-feed-server image SBOM
        run: |
          syft "${IMAGE_PREFIX}/server@${{ steps.build_server.outputs.digest }}" -o spdx-json=server-image.sbom.spdx.json

      - name: Attest wg-feed-server image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/server
          subject-digest: ${{ steps.build_server.outputs.digest }}
          sbom-path: server-image.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Build and push wg-feed-upload
        id: build_upload
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/scratch.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/upload:latest
            ${{ env.IMAGE_PREFIX }}/upload:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY_PREFIX=dist/wg-feed-upload_linux

      - name: Sign wg-feed-upload image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/upload@${{ steps.build_upload.outputs.digest }}"

      - name: Attest wg-feed-upload image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/upload
          subject-digest: ${{ steps.build_upload.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate wg-feed-upload image SBOM
        run: |
          syft "${IMAGE_PREFIX}/upload@${{ steps.build_upload.outputs.digest }}" -o spdx-json=upload-image.sbom.spdx.json

      - name: Attest wg-feed-upload image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/upload
          subject-digest: ${{ steps.build_upload.outputs.digest }}
          sbom-path: upload-image.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Build and push wg-feed-daemon
        id: build_daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/wireguard.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/daemon:latest
            ${{ env.IMAGE_PREFIX }}/daemon:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY_PREFIX=dist/wg-feed-daemon_linux

      - name: Sign wg-feed-daemon image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/daemon@${{ steps.build_daemon.outputs.digest }}"

      - name: Attest wg-feed-daemon image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/daemon
          subject-digest: ${{ steps.build_daemon.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate wg-feed-daemon image SBOM
        run: |
          syft "${IMAGE_PREFIX}/daemon@${{ steps.build_daemon.outputs.digest }}" -o spdx-json=daemon-image.sbom.spdx.json

      - name: Attest wg-feed-daemon image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/daemon
          subject-digest: ${{ steps.build_daemon.outputs.digest }}
          sbom-path: daemon-image.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Build and push wg-feed-apply
        id: build_apply
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/wireguard.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/apply:latest
            ${{ env.IMAGE_PREFIX }}/apply:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY_PREFIX=dist/wg-feed-apply_linux

      - name: Sign wg-feed-apply image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/apply@${{ steps.build_apply.outputs.digest }}"

      - name: Attest wg-feed-apply image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/apply
          subject-digest: ${{ steps.build_apply.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Generate wg-feed-apply image SBOM
        run: |
          syft "${IMAGE_PREFIX}/apply@${{ steps.build_apply.outputs.digest }}" -o spdx-json=apply-image.sbom.spdx.json

      - name: Attest wg-feed-apply image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/apply
          subject-digest: ${{ steps.build_apply.outputs.digest }}
          sbom-path: apply-image.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
