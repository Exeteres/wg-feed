name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/exeteres/wg-feed

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push wg-feed-server
        id: build_server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/scratch.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/server:latest
            ${{ env.IMAGE_PREFIX }}/server:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            CMD=wg-feed-server

      - name: Sign wg-feed-server image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/server@${{ steps.build_server.outputs.digest }}"

      - name: Build and push wg-feed-upload
        id: build_upload
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/scratch.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/upload:latest
            ${{ env.IMAGE_PREFIX }}/upload:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            CMD=wg-feed-upload

      - name: Sign wg-feed-upload image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/upload@${{ steps.build_upload.outputs.digest }}"

      - name: Build and push wg-feed-daemon
        id: build_daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/wireguard.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/daemon:latest
            ${{ env.IMAGE_PREFIX }}/daemon:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            CMD=wg-feed-daemon

      - name: Sign wg-feed-daemon image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/daemon@${{ steps.build_daemon.outputs.digest }}"

      - name: Build and push wg-feed-apply
        id: build_apply
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/wireguard.dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/apply:latest
            ${{ env.IMAGE_PREFIX }}/apply:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            CMD=wg-feed-apply

      - name: Sign wg-feed-apply image
        run: |
          cosign sign --yes "${IMAGE_PREFIX}/apply@${{ steps.build_apply.outputs.digest }}"
